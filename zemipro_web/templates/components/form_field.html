<div class="form__group ui-field{% if field.errors %} ui-field--invalid{% endif %}">
    {% if not field.is_hidden %}<label for="{{ field.id_for_label }}" class="form__label ui-field__label">{{ field.label }}</label>{% endif %}
    {{ field }}
    {% if field.help_text %}<p class="form__hint ui-field__help">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="form__error ui-field__error" role="alert">{{ error }}</p>{% endfor %}
</div>
