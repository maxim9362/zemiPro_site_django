# Local development ONLY. Do not reuse existing production PostgreSQL volumes.
name: zemipro-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-zemipro_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile.django
    restart: unless-stopped
    environment:
      DJANGO_ENV: development
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-development-only-key-never-use-in-production}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: ${DB_NAME:-zemipro_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      RUN_MIGRATIONS: "1"
      WEB_CONCURRENCY: "2"
      ZEMIPRO_GOOGLE_LOGIN_ENABLED: ${ZEMIPRO_GOOGLE_LOGIN_ENABLED:-false}
      ZEMIPRO_GOOGLE_CLIENT_ID: ${ZEMIPRO_GOOGLE_CLIENT_ID:-}
      ZEMIPRO_GOOGLE_CLIENT_SECRET: ${ZEMIPRO_GOOGLE_CLIENT_SECRET:-}
      ZEMIPRO_CONTACT_DELIVERY_MODE: ${ZEMIPRO_CONTACT_DELIVERY_MODE:-disabled}
      ZEMIPRO_SMTP_HOST: ${ZEMIPRO_SMTP_HOST:-}
      ZEMIPRO_SMTP_PORT: ${ZEMIPRO_SMTP_PORT:-587}
      ZEMIPRO_SMTP_USERNAME: ${ZEMIPRO_SMTP_USERNAME:-}
      ZEMIPRO_SMTP_PASSWORD: ${ZEMIPRO_SMTP_PASSWORD:-}
      ZEMIPRO_EMAIL_FROM: ${ZEMIPRO_EMAIL_FROM:-}
    volumes:
      - dev_static:/app/staticfiles
      - dev_media:/app/media
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

networks:
  backend:

volumes:
  dev_postgres:
  dev_static:
  dev_media:
