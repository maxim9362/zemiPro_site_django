name: Django CI

on:
  push:
    branches:
      - 'stage-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    name: django-postgresql
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zemipro_ci
          POSTGRES_PASSWORD: ci-only-synthetic-password
          POSTGRES_DB: zemipro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zemipro_ci -d zemipro_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_ENV: test
      DJANGO_SETTINGS_MODULE: core.settings
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: zemipro_ci
      DB_USER: zemipro_ci
      DB_PASSWORD: ci-only-synthetic-password
      PYTHONDONTWRITEBYTECODE: "1"

    defaults:
      run:
        working-directory: zemipro_web
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            zemipro_web/requirements.txt
            zemipro_web/requirements-ci.txt

      - name: Install pinned runtime and CI tools
        run: |
          python -m pip install -r requirements.txt -r requirements-ci.txt
          python -m pip check

      - name: Lint Django Python sources
        run: |
          python -m compileall -q apps core manage.py
          python -m ruff check apps core manage.py

      - name: Validate development and staging Compose (no containers started)
        env:
          STAGING_DOMAIN: ci-staging.example.invalid
          STAGING_DB_PASSWORD: ci-only-synthetic-staging-password
          STAGING_DJANGO_SECRET_KEY: ci-only-synthetic-staging-secret-W8k2P7q4R6s1V3x5Z7c9B2n4M6a8D0
        run: |
          docker compose -f docker-compose.django.yml config --quiet
          docker compose -f docker-compose.staging.yml config --quiet
          docker compose --profile maintenance -f docker-compose.staging.yml config --quiet
          sh -n docker/staging-backup.sh docker/check-staging-health.sh

      - name: Check Django and migration/model consistency
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Apply clean isolated PostgreSQL migrations
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --check

      - name: Stage 02.1 catalog seed round-trip on isolated CI PostgreSQL
        run: |
          python manage.py seed_service_catalog --plan
          python manage.py seed_service_catalog
          python manage.py seed_service_catalog --check
          python manage.py seed_service_catalog
          python manage.py seed_service_catalog --check
          python manage.py shell -c "from apps.marketplace.models import ServiceSection, Category, Subcategory; counts = (ServiceSection.objects.count(), Category.objects.count(), Subcategory.objects.count()); assert counts == (12, 19, 88), counts; print('STAGE_02_1_CATALOG_SEED_PASS', counts)"

      - name: Stage 02.2 city/district seed round-trip on isolated CI PostgreSQL
        run: |
          python manage.py seed_israel_cities --plan
          python manage.py seed_israel_cities
          python manage.py seed_israel_cities --check
          python manage.py seed_israel_cities
          python manage.py seed_israel_cities --check
          python manage.py shell -c "from apps.locations.models import District, City, CityAlias; counts = (District.objects.count(), City.objects.count(), CityAlias.objects.count()); assert counts == (6, 25, 4), counts; print('STAGE_02_2_GEO_SEED_PASS', counts)"

      - name: Stage 02.5 versioned questionnaire seed on isolated PostgreSQL
        run: |
          python manage.py seed_demo_questionnaires --plan
          python manage.py seed_demo_questionnaires --publish
          python manage.py seed_demo_questionnaires --check
          python manage.py seed_demo_questionnaires --publish
          python manage.py shell -c "from apps.marketplace.models import ServiceQuestionnaire, QuestionnaireVersion; counts = (ServiceQuestionnaire.objects.count(), QuestionnaireVersion.objects.count()); assert counts == (4, 4), counts; print('STAGE_02_5_QUESTIONNAIRES_PASS', counts)"

      - name: Stage 02.5 questionnaire version and private answer regressions
        run: |
          python manage.py test apps.marketplace.tests.test_stage02_questionnaires

      - name: Stage 02.3 English/Hebrew locale regression tests
        run: |
          python manage.py test core.tests.test_i18n

      - name: Stage 02.4 add-only multilingual public URL regression tests
        run: |
          python manage.py test apps.marketplace.tests.test_stage02_i18n_urls

      - name: Stage 02.6 integrated identity, seed and i18n regressions
        run: |
          python manage.py test apps.marketplace.tests.test_stage02_integration

      - name: Stage 02 Ashdod-only public pilot regression tests
        run: |
          python manage.py test apps.marketplace.tests.test_stage02_ashdod_pilot

      - name: Install pinned isolated Chrome driver for mobile viewport checks
        run: |
          python -m pip install playwright==1.56.0

      - name: Stage 02.6 browser mobile RTL smoke (isolated synthetic CI)
        # Public-browser checks must exercise the real Ashdod-only policy;
        # historical multi-city unit tests run separately in general test mode.
        env:
          ZEMIPRO_TEST_ASHDOD_ONLY: "1"
        run: |
          set -euo pipefail
          python manage.py runserver --insecure --noreload 127.0.0.1:8765 > /tmp/stage02-django-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/stage02_mobile_rtl_smoke.py

      - name: Upload Stage 02.6 screenshots for independent visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage02-mobile-rtl-screenshots
          path: zemipro_web/artifacts/stage02-mobile-rtl/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage 06 mobile RTL offer comparison and privacy browser smoke
        env:
          ZEMIPRO_TEST_ASHDOD_ONLY: "1"
        run: |
          set -euo pipefail
          python manage.py runserver --insecure --noreload 127.0.0.1:8766 > /tmp/stage06-django-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/stage06_browser_smoke.py

      - name: Upload Stage 06 comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage06-mobile-rtl-screenshots
          path: zemipro_web/artifacts/stage06-mobile-rtl/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage 07 synthetic PostgreSQL upgrade and rollback rehearsal
        run: |
          python scripts/stage07_upgrade_rehearsal.py
          python manage.py migrate --check
          python manage.py makemigrations --check --dry-run

      - name: Stage 07 targeted security, translation and E2E tests
        run: |
          python manage.py test \
            apps.marketplace.tests.test_stage07_chat_permissions \
            apps.marketplace.tests.test_stage07_chat_http \
            apps.marketplace.tests.test_stage07_chat_attachments \
            apps.marketplace.tests.test_stage07_chat_concurrency \
            apps.marketplace.tests.test_stage07_notifications \
            apps.marketplace.tests.test_stage07_review \
            apps.marketplace.tests.test_stage07_moderation \
            apps.marketplace.tests.test_stage07_translation \
            apps.marketplace.tests.test_stage07_e2e \
            apps.marketplace.tests.test_stage07_independent \
            apps.marketplace.tests.test_stage07_appeal_integrity

      - name: Stage 07 Chromium mobile chat, privacy and RTL smoke
        env:
          ZEMIPRO_TEST_ASHDOD_ONLY: "1"
        run: |
          set -euo pipefail
          python manage.py runserver --insecure --noreload 127.0.0.1:8767 > /tmp/stage07-django-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/stage07_browser_smoke.py

      - name: Upload Stage 07 mobile chat screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage07-chat-mobile-rtl-screenshots
          path: zemipro_web/artifacts/stage07-chat-mobile/
          if-no-files-found: ignore
          retention-days: 7

      # Stage08.6 screens are new frontend coverage, independent from Stage02/06/07.
      # Browser/fixtures use only the disposable CI PostgreSQL 17 service.
      - name: Stage 08.6 mobile RTL keyboard accessibility smoke
        env:
          ZEMIPRO_TEST_ASHDOD_ONLY: "1"
        run: |
          set -euo pipefail
          python manage.py runserver --insecure --noreload 127.0.0.1:8768 > /tmp/stage08-django-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/stage08_mobile_a11y_smoke.py

      - name: Upload Stage 08.6 responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage08-mobile-a11y-screenshots
          path: zemipro_web/artifacts/stage08-mobile-a11y/
          if-no-files-found: ignore
          retention-days: 7

      # Stage08.7: real HTML/POST browser journeys on synthetic test DB only.
      - name: Stage 08.7 UX and permission browser E2E
        env:
          ZEMIPRO_TEST_ASHDOD_ONLY: "1"
        run: |
          set -euo pipefail
          python manage.py runserver --insecure --noreload 127.0.0.1:8769 > /tmp/stage08-e2e.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python scripts/stage08_ux_e2e.py

      - name: Upload Stage 08.7 UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage08-ux-e2e-screenshots
          path: zemipro_web/artifacts/stage08-ux-e2e/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Django suite with service coverage gate
        run: |
          python -m coverage run manage.py test
          python -m coverage report

      - name: Validate strict production settings without deployment
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-only-synthetic-secret-9hW8k2P7q4R6s1V3x5Z7c9B2n4M6a8D0
          DJANGO_ALLOWED_HOSTS: ci.example.invalid
        run: |
          python manage.py check --deploy
